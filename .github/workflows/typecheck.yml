name: Typecheck

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".github/ISSUE_TEMPLATE/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - LICENSE
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    name: ui check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/ui check

  tauri:
    name: tauri check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri check
