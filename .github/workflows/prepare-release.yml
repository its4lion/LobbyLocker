name: Prepare Release
run-name: Prepare v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix (for example, 0.1.0-beta.1)
        required: true
        type: string

concurrency:
  group: prepare-release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  VERSION: ${{ inputs.version }}

jobs:
  validate:
    name: Validate version
    runs-on: ubuntu-24.04
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
      - run: pnpm install --frozen-lockfile
      - name: Validate all version metadata
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const version = process.env.VERSION;
          const semver = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          if (!semver.test(version)) {
            throw new Error(`Invalid semantic version: ${version}`);
          }

          const jsonVersions = [
            "package.json",
            "apps/tauri/package.json",
            "packages/ui/package.json",
            "apps/tauri/src-tauri/tauri.conf.json",
          ];
          for (const file of jsonVersions) {
            const actual = JSON.parse(fs.readFileSync(file, "utf8")).version;
            if (actual !== version) {
              throw new Error(`${file} has version ${actual}, expected ${version}`);
            }
          }

          const metadata = JSON.parse(
            execFileSync(
              "cargo",
              ["metadata", "--format-version", "1", "--locked", "--no-deps"],
              { encoding: "utf8" },
            ),
          );
          const workspacePackages = metadata.packages.filter((pkg) =>
            ["lobbylocker-core", "lobbylocker-tauri"].includes(pkg.name),
          );
          if (workspacePackages.length !== 2) {
            throw new Error("Could not find both LobbyLocker Rust workspace packages");
          }
          for (const pkg of workspacePackages) {
            if (pkg.version !== version) {
              throw new Error(`${pkg.name} has version ${pkg.version}, expected ${version}`);
            }
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `prerelease=${version.includes("-")}\n`,
          );
          NODE
      - name: Ensure the tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists." >&2
            exit 1
          fi
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi

  source-quality:
    name: Format, typecheck, and frontend tests
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm -r check
      - run: pnpm --filter @lobbylocker/tauri test

  rust-linux:
    name: Rust tests and Clippy / Arch Linux
    needs: validate
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git gtk3 webkit2gtk-4.1 librsvg pkgconf nodejs pnpm
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-ubuntu:
    name: Rust tests and Clippy / Ubuntu 24.04
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  rust-windows:
    name: Rust tests and Clippy / Windows
    needs: validate
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri web:build
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-arch:
    name: Build Arch package
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: ubuntu-24.04
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm git gtk3 webkit2gtk-4.1 librsvg pkgconf nodejs pnpm rustup nftables polkit namcap
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup default 1.90.0
      - run: pnpm install --frozen-lockfile
      - name: Build release executable
        run: pnpm --filter @lobbylocker/tauri exec tauri build --no-bundle
      - name: Build pacman package
        shell: bash
        run: |
          package_root="${RUNNER_TEMP}/lobbylocker-arch"
          install -d "${package_root}/payload"
          install -Dm755 target/release/lobbylocker "${package_root}/payload/lobbylocker"
          cp -a data "${package_root}/payload/data"
          install -Dm644 apps/tauri/src-tauri/icons/icon.png "${package_root}/payload/lobbylocker.png"
          install -Dm644 packaging/arch/lobbylocker.desktop "${package_root}/payload/lobbylocker.desktop"
          install -Dm644 packaging/arch/lobbylocker-reset-firewall.hook "${package_root}/payload/lobbylocker-reset-firewall.hook"
          install -Dm644 LICENSE "${package_root}/payload/LICENSE"
          cp packaging/arch/PKGBUILD.release "${package_root}/PKGBUILD"
          if [[ "${VERSION}" == *-* ]]; then
            arch_version="${VERSION%%-*}pre.${VERSION#*-}"
            arch_version="${arch_version%%+*}"
            arch_version="${arch_version//-/.}"
          else
            arch_version="${VERSION%%+*}"
          fi
          sed -i "s/^pkgver=.*/pkgver=${arch_version}/" "${package_root}/PKGBUILD"
          useradd --create-home builder
          chown -R builder:builder "${package_root}"
          runuser -u builder -- bash -lc "cd '${package_root}' && makepkg --noconfirm"
          package_file=$(find "${package_root}" -maxdepth 1 -name '*.pkg.tar.zst' -type f -print -quit)
          test -n "${package_file}"
          namcap "${package_root}/PKGBUILD"
          namcap "${package_file}"
          mkdir -p release-assets
          cp "${package_file}" release-assets/
      - uses: actions/upload-artifact@v7
        with:
          name: arch-package
          path: release-assets/*.pkg.tar.zst
          if-no-files-found: error

  build-appimage:
    name: Build AppImage
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: ubuntu-22.04
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles appimage
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  build-ubuntu:
    name: Build Ubuntu 24.04 DEB
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build package-managed DEB
        run: >-
          pnpm --filter @lobbylocker/tauri exec tauri build --bundles deb
          --config apps/tauri/src-tauri/tauri.no-updater-artifacts.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: ubuntu-deb
          path: target/release/bundle/deb/*.deb
          if-no-files-found: error

  build-windows:
    name: Build Windows NSIS installer
    needs: [validate, source-quality, rust-linux, rust-ubuntu, rust-windows]
    runs-on: windows-2025
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@1.90.0
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lobbylocker/tauri exec tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  draft:
    name: Create draft release
    needs: [validate, build-arch, build-appimage, build-ubuntu, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        shell: bash
        run: |
          (cd release-assets && find . -maxdepth 1 -type f ! -name 'LobbyLocker-SHA256SUMS.txt' -printf '%f\0' | sort -z | xargs -0 sha256sum) > release-assets/LobbyLocker-SHA256SUMS.txt
      - name: Create tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
        shell: bash
        run: |
          args=(
            "v${VERSION}"
            release-assets/*
            --draft
            --generate-notes
            --target "${GITHUB_SHA}"
            --title "LobbyLocker v${VERSION}"
          )
          if [ "${PRERELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
