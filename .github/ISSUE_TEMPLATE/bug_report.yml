name: Bug report
description: Report a reproducible LobbyLocker problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not post secrets, private IPs, or sensitive paths. Use GitHub Security Advisories for security issues.
  - type: input
    id: version
    attributes:
      label: LobbyLocker version
      placeholder: v0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows 11, Linux, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Include what you selected, what you clicked, and what happened.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Redact usernames, private addresses, and installation paths where needed.
